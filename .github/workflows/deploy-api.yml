name: Deploy Optimus API

on:
  workflow_dispatch:
  push:
    branches: [release/mvp-stabilization]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TMDB_READ_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build applications
        run: npm run build

      - name: Provision free-tier D1 account database
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          LIST=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          echo "$LIST" | jq -e '.success == true' >/dev/null || { echo "$LIST" | jq -r '.errors[]?.message // "Cloudflare D1 access denied"'; exit 1; }
          DB_ID=$(echo "$LIST" | jq -r '.result[] | select(.name == "optimus-users") | .uuid' | head -n 1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATED=$(curl -sS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"optimus-users"}')
            echo "$CREATED" | jq -e '.success == true' >/dev/null || { echo "$CREATED" | jq -r '.errors[]?.message // "Unable to create the D1 database"'; exit 1; }
            DB_ID=$(echo "$CREATED" | jq -r '.result.uuid')
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply account database migrations
        run: npx wrangler d1 migrations apply optimus-users --remote --config apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Cloudflare Workers
        run: npx wrangler deploy --config apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure TMDB access token on Worker
        run: printf '%s' "$TMDB_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_READ_ACCESS_TOKEN --config apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

      - name: End-to-end account registration, session, and profile test
        run: |
          set -euo pipefail
          BASE="https://optimus-api.jpdeters1.workers.dev"
          EMAIL="optimus-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          PASSWORD="Optimus-Smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Secure!"
          COOKIE_JAR="$(mktemp)"
          cleanup() {
            npx wrangler d1 execute optimus-users --remote --config apps/api/wrangler.toml --command "DELETE FROM users WHERE email='$EMAIL'" >/dev/null 2>&1 || true
            rm -f "$COOKIE_JAR"
          }
          trap cleanup EXIT

          STATUS=$(curl -sS -o /tmp/register.json -w "%{http_code}" -c "$COOKIE_JAR" -X POST "$BASE/api/auth/register" -H "Content-Type: application/json" --data "$(jq -n --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password}')")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Real account registration failed (HTTP $STATUS). Safe response:"
            jq -c '{error}' /tmp/register.json || cat /tmp/register.json
            exit 1
          fi
          jq -e --arg email "$EMAIL" '.user.email == $email' /tmp/register.json

          curl -fsS -b "$COOKIE_JAR" "$BASE/api/auth/me" | jq -e --arg email "$EMAIL" '.user.email == $email'
          curl -fsS -b "$COOKIE_JAR" -X PUT "$BASE/api/profile" -H "Content-Type: application/json" --data '{"providers":["8"],"watchlist":[]}' | jq -e '.ok == true'
          curl -fsS -b "$COOKIE_JAR" "$BASE/api/profile" | jq -e '.profile.providers == ["8"]'
          curl -fsS -b "$COOKIE_JAR" -X POST "$BASE/api/auth/logout" | jq -e '.ok == true'
          echo "Real registration, cookie session, profile persistence, and logout all passed."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
