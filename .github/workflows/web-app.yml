name: Build and deploy OPTIMUS web app
on:
  push:
    branches: [release/mvp-stabilization]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-app.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build all applications
        run: npm run build
      - name: Verify web output
        run: test -s apps/web/dist/index.html && test -s apps/web/dist/manifest.webmanifest && test -s apps/web/dist/sw.js
      - name: Check Cloudflare deployment credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy OPTIMUS to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name optimus --branch release/mvp-stabilization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed OPTIMUS app and API proxy
        run: |
          curl -fsS https://optimus-bud.pages.dev/ | grep -q "OPTIMUS"
          curl -fsS https://optimus-bud.pages.dev/api/health | jq -e '.status == "ok" and .service == "optimus-api"'
          curl -fsS https://optimus-bud.pages.dev/api/providers | jq -e '.items | length > 0'
      - name: Verify account POST requests return API JSON
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/optimus-auth-response.json -w "%{http_code}" -X POST https://optimus-bud.pages.dev/api/auth/register -H "Content-Type: application/json" -d "{}")
          test "$STATUS" = "400"
          jq -e '.error == "Enter a valid email address."' /tmp/optimus-auth-response.json
